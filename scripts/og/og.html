<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>arthlabs og</title>
<style>
  @font-face {
    font-family: 'Archivo Variable';
    src: url('../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2') format('woff2');
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #070B14; }
  body {
    position: relative;
    color: #E6ECF5;
    font-family: 'Archivo Variable', sans-serif;
    background:
      radial-gradient(720px 315px at 0% 0%, rgba(29, 78, 216, 0.30), transparent 70%),
      radial-gradient(600px 283px at 100% 100%, rgba(245, 165, 36, 0.16), transparent 70%),
      radial-gradient(480px 252px at 100% 0%, rgba(29, 78, 216, 0.14), transparent 70%),
      #070B14;
  }
  .frame {
    position: absolute;
    inset: 64px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 460px;
    gap: 40px;
    align-items: center;
  }
  .id { display: grid; gap: 28px; align-content: center; }
  .mark { width: 120px; height: 120px; }
  .name {
    font-stretch: 112%;
    font-weight: 750;
    font-size: 58px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .role { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #7CC4FF; }
  .site { font-family: 'JetBrains Mono', monospace; font-size: 22px; color: #8C9AB3; }
  .diagram svg { width: 460px; height: auto; overflow: visible; }
  .diagram title, .diagram desc { display: none; }
  .diagram .edges path { fill: none; stroke: rgba(124, 196, 255, 0.35); stroke-width: 1.5; }
  .diagram .flows path { fill: none; stroke: #F5A524; stroke-width: 2; stroke-linecap: round; opacity: 0.6; }
  .diagram .nodes rect { fill: #0C1322; stroke: #1B2740; stroke-width: 1; }
  .diagram .nodes text {
    fill: #E6ECF5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-anchor: middle;
    dominant-baseline: central;
  }
</style>
</head>
<body>
  <main class="frame">
    <section class="id">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="2.5" y="9.5" width="27" height="13" rx="2.5" stroke="#7CC4FF" stroke-width="2.2"></rect>
        <path d="M7 13.5V18.5M10.5 13.5V18.5M14 13.5V18.5" stroke="#7CC4FF" stroke-width="1.8" stroke-linecap="round"></path>
        <circle cx="24" cy="16" r="2.6" fill="#F5A524"></circle>
      </svg>
      <h1 class="name">Arthur Jhonathas</h1>
      <p class="role">Infra &amp; SysAdmin · Maceió, BR</p>
      <p class="site">arthlabs.dev</p>
    </section>
    <div class="diagram"><!--DIAGRAM--></div>
  </main>
</body>
</html>
